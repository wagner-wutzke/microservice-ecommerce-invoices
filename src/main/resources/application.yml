server:
  port: ${APP_PORT:9040}
spring:
  application:
    name: invoices-service
  datasource:
    url: jdbc:h2:file:./data/invoices-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
    show-sql: false
    defer-datasource-initialization: true
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:invoices-events-group.v1}
      properties:
        spring.json.trusted.packages: "net.wowdev.ecommerce.domain.events"
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        linger.ms: 0

app:
  kafka:
    orders-topic: ${KAFKA_ORDERS_TOPIC:orders-topic.v1}
    payments-topic: ${KAFKA_PAYMENTS_TOPIC:payments-topic.v1}
    invoices-topic: ${KAFKA_INVOICES_TOPIC:invoices-topic.v1}

  service:
    payment.failing: ${SERVICE_PAYMENTS_FAILING:false}
    invoices.failing: ${SERVICE_INVOICES_FAILING:false}
    shipments.failing: ${SERVICE_SHIPMENTS_FAILING:false}

logging:
  level:
    org.hibernate.orm.jdbc.bind: INFO
    org.apache.kafka.common: ERROR
    org.apache.kafka.clients: ERROR
    net.wowdev.ecommerce.orders: ${LOG_LEVEL_ORDERS_SERVICE:DEBUG}
    net.wowdev.ecommerce.customers: ${LOG_LEVEL_CUSTOMERS_SERVICE:DEBUG}
    net.wowdev.ecommerce.inventory: ${LOG_LEVEL_INVENTORY_SERVICE:DEBUG}
    net.wowdev.ecommerce.payments: ${LOG_LEVEL_PAYMENTS_SERVICE:DEBUG}
    net.wowdev.ecommerce.invoices: ${LOG_LEVEL_INVOICES_SERVICE:DEBUG}
    net.wowdev.ecommerce.shipments: ${LOG_LEVEL_SHIPMENTS_SERVICE:DEBUG}
    net.wowdev.ecommerce.datareplication: ${LOG_LEVEL_DATAREPLICATION:INFO}
